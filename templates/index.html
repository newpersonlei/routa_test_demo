<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <link rel="stylesheet" href="/static/css/game.css">
</head>
<body>
  <div id="game-container">
    <div id="game-board">
      <canvas id="game-canvas" width="300" height="600"></canvas>
      <div id="game-over-overlay" class="hidden">
        <button id="restart-btn">重新开始</button>
      </div>
    </div>
    <div id="sidebar">
      <div class="sidebar-section">
        <h3>下一个</h3>
        <canvas id="next-canvas" width="120" height="120"></canvas>
      </div>
      <div class="sidebar-section">
        <h3>分数</h3>
        <div id="score-value" class="stat-value">0</div>
      </div>
      <div class="sidebar-section">
        <h3>等级</h3>
        <div id="level-value" class="stat-value">1</div>
      </div>
      <div class="sidebar-section">
        <h3>已消行数</h3>
        <div id="lines-value" class="stat-value">0</div>
      </div>
    </div>
  </div>
  <script type="module" src="/static/js/game.js"></script>
</body>
</html>
