<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris 多人对战</title>
  <link rel="stylesheet" href="/static/css/game.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="game-board">
      <canvas id="game-canvas" width="300" height="600"></canvas>
      <div id="game-over-overlay" class="hidden">
        <button id="restart-btn">重新开始</button>
      </div>
    </div>
    <div id="sidebar">
      <div class="sidebar-section">
        <h3>下一个</h3>
        <canvas id="next-canvas" width="120" height="120"></canvas>
      </div>
      <div class="sidebar-section">
        <h3>分数</h3>
        <div id="score-value" class="stat-value">0</div>
      </div>
      <div class="sidebar-section">
        <h3>等级</h3>
        <div id="level-value" class="stat-value">1</div>
      </div>
      <div class="sidebar-section">
        <h3>已消行数</h3>
        <div id="lines-value" class="stat-value">0</div>
      </div>
      <div class="sidebar-section">
        <div id="room-panel">
          <h3>多人对战</h3>
          <input type="text" id="player-name" placeholder="你的昵称" maxlength="12">
          <div class="room-actions">
            <button id="create-room-btn">创建房间</button>
            <input type="text" id="room-id-input" placeholder="房间ID" maxlength="6">
            <button id="join-room-btn">加入房间</button>
          </div>
          <div id="room-info"></div>
          <button id="start-btn" style="display:none;">开始游戏</button>
          <div id="multiplayer-status"></div>
          <hr>
          <button id="single-btn">单人模式</button>
        </div>
      </div>
    </div>
  </div>
  <div id="opponents-container"></div>
  <script type="module" src="/static/js/game.js"></script>
</body>
</html>
