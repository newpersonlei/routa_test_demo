<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人对战 - 房间大厅</title>
  <link rel="stylesheet" href="/static/css/multiplayer.css">
</head>
<body>
  <div class="lobby-container">
    <h1 class="lobby-title">多人对战大厅</h1>

    <div class="lobby-panel">
      <div class="lobby-section">
        <h2>创建房间</h2>
        <button id="btn-create-room" class="btn btn-primary">创建房间</button>
      </div>

      <div class="lobby-divider"></div>

      <div class="lobby-section">
        <h2>加入房间</h2>
        <div class="join-room-form">
          <input
            type="text"
            id="input-room-id"
            class="input-room-id"
            placeholder="输入房间 ID"
            maxlength="20"
          >
          <button id="btn-join-room" class="btn btn-secondary">加入房间</button>
        </div>
      </div>
    </div>

    <div id="lobby-status" class="lobby-status" aria-live="polite"></div>
    <div id="room-list" class="room-list"></div>
  </div>

  <script src="/static/js/lobby.js"></script>
</body>
</html>
